# Pings Supabase every 3 days so the free project never gets paused.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (the anon key).
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_form" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"fid":"ping"}'

